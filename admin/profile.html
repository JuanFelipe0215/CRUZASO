<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUDTASK | Perfil</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../styles/dash.css">
  <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
  <div class="ct-page">
    <aside class="ct-sidebar" id="ctSidebar"></aside>

    <div class="ct-main">
      <header id="ctTopbar"></header>

      <div class="mt-3">
        <h1 class="h4 fw-bold mb-3">My Profile</h1>

        <div class="row g-3">
          <div class="col-lg-4">
            <div class="ct-card">
              <div class="ct-card-body text-center">
                <div id="avatar" class="ct-avatar mx-auto" style="width:84px;height:84px;font-size:1.7rem;">U</div>
                <h2 id="pName" class="h5 fw-bold mt-3 mb-1">—</h2>
                <div class="d-flex justify-content-center gap-2">
                  <span id="pRole" class="badge text-bg-primary">User</span>
                </div>

                <div class="ct-muted mt-2">
                  <i class="bi bi-envelope"></i>
                  <span id="pEmail">—</span>
                </div>

                <div class="mt-3">
                  <div class="ct-muted small">Tasks</div>
                  <div id="pTasks" class="fw-bold fs-4">0</div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="ct-card">
              <div class="ct-card-header">
                <div class="fw-bold">Personal Information</div>
                <button id="btnEdit" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-pencil"></i> Edit Profile
                </button>
              </div>

              <div class="ct-card-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="ct-muted small">Full Name</div>
                    <div id="iFullName" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="ct-muted small">Email</div>
                    <div id="iEmail" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="ct-muted small">Phone</div>
                    <div id="iPhone" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="ct-muted small">Department</div>
                    <div id="iDepartment" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="ct-muted small">Role Level</div>
                    <div id="iRoleLevel" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="ct-muted small">Join Date</div>
                    <div id="iJoinDate" class="fw-semibold">—</div>
                  </div>
                </div>
                <p class="small ct-muted mt-3 mb-0">
                  * Puedes editar nombre, teléfono y departamento. El email y rol no se editan.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Edit Modal -->
      <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Editar perfil</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <div id="modalAlert"></div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input id="mFullName" class="form-control" type="text">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Phone</label>
                <input id="mPhone" class="form-control" type="text" placeholder="+57 301 000 0000">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Department</label>
                <input id="mDepartment" class="form-control" type="text" placeholder="Computer Science">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button id="btnSaveProfile" type="button" class="btn btn-primary ct-btn-primary">Guardar</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./profile.js"></script>
</body>

</html>
