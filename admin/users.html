<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUDZASO | Users</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
  <div class="container-fluid">
    <div class="row min-vh-100">


      <aside class="col-12 col-lg-3 col-xl-2 bg-white border-end p-3">
        <div class="d-flex align-items-center justify-content-center justify-content-lg-start gap-2 mb-4">
          <img src="../images/Background.png" width="44" alt="Logo">
          <div class="fw-bold">CRUDZASO</div>
        </div>

        <nav class="nav nav-pills flex-column gap-2">
          <a class="nav-link text-dark" href="./admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
          <a class="nav-link text-dark" href="./tasks.html"><i class="bi bi-list-check me-2"></i> Tasks</a>
          <a class="nav-link active" href="./users.html"><i class="bi bi-people me-2"></i> Users</a>
          <a class="nav-link text-dark" href="./profile.html"><i class="bi bi-person me-2"></i> Profile</a>
        </nav>
      </aside>

      <main class="col-12 col-lg-9 col-xl-10 p-3 p-md-4">
        <header id="ctTopbar" class="mb-3"></header>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <div>
            <h1 class="h4 fw-bold mb-1">Users</h1>
          </div>
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="q" class="form-control" placeholder="Search by name or email...">
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th style="width:120px;">Role</th>
                  <th style="width:140px;">Tasks</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../guards/guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./users.js"></script>
</body>
</html>
