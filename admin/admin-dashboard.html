<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUDZASO | Admin Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
  <div class="container-fluid">
    <div class="row min-vh-100">


      <aside class="col-12 col-lg-3 col-xl-2 bg-white border-end p-3">
        <div class="d-flex align-items-center justify-content-center justify-content-lg-start gap-2 mb-4">
          <img src="../images/Background.png" width="44" alt="Logo">
          <div class="fw-bold">CRUDZASO</div>
        </div>

        <nav class="nav nav-pills flex-column gap-2">
          <a class="nav-link active" href="./admin-dashboard.html">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
          <a class="nav-link text-dark" href="./tasks.html">
            <i class="bi bi-list-check me-2"></i> Tasks
          </a>
          <a class="nav-link text-dark" href="./users.html">
            <i class="bi bi-people me-2"></i> Users
          </a>
          <a class="nav-link text-dark" href="./profile.html">
            <i class="bi bi-person me-2"></i> Profile
          </a>
        </nav>
      </aside>


      <main class="col-12 col-lg-9 col-xl-10 p-3 p-md-4">


        <header id="ctTopbar" class="mb-3"></header>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <div>
            <h1 class="h4 fw-bold mb-1">Task Manager</h1>
            <div class="text-secondary">Overview of your current academic performance tasks.</div>
          </div>

          <a class="btn btn-primary" href="./task-form.html">
            <i class="bi bi-plus-lg me-1"></i> New Task
          </a>
        </div>

        <section class="row g-3">
          <div class="col-12 col-md-6 col-xl-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between text-secondary small">
                  <span>Total Tasks</span>
                  <i class="bi bi-layers"></i>
                </div>
                <div id="adminTotal" class="fs-2 fw-bold mt-1">0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-xl-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between text-secondary small">
                  <span>Completed</span>
                  <i class="bi bi-check-circle"></i>
                </div>
                <div id="adminCompleted" class="fs-2 fw-bold mt-1">0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-xl-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between text-secondary small">
                  <span>Pending</span>
                  <i class="bi bi-hourglass-split"></i>
                </div>
                <div id="adminPending" class="fs-2 fw-bold mt-1">0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-xl-3">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between text-secondary small">
                  <span>Overall Progress</span>
                  <i class="bi bi-graph-up"></i>
                </div>

                <div class="d-flex align-items-baseline gap-2 mt-1">
                  <span id="adminProgress" class="fs-2 fw-bold">0%</span>
                  <span class="badge text-bg-light">Users: <span id="adminUsers">0</span></span>
                </div>
              </div>
            </div>
          </div>
        </section>


        <section class="card shadow-sm mt-3">
          <div class="card-header bg-white d-flex align-items-center justify-content-between gap-2">
            <div class="fw-bold">Upcoming / Recent Tasks</div>
            <a class="btn btn-outline-secondary btn-sm" href="./tasks.html">
              Ver todas <i class="bi bi-arrow-right ms-1"></i>
            </a>
          </div>

          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Task</th>
                    <th style="width:190px;">Assignee</th>
                    <th style="width:190px;">Status</th>
                    <th style="width:120px;">Priority</th>
                    <th style="width:140px;">Due date</th>
                    <th style="width:120px;">Actions</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="../guards/guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./admin-dashboard.js"></script>
</body>
</html>
