<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRUDZASO | Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/dash.css">
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <div class="ct-page">
        <aside class="ct-sidebar" id="ctSidebar">
            <div class="text-center d-flex align-items-center m-2 ">
                <img src="../images/Background.png" width="50px" alt="">
                <h1 class="h4 fw-bold mb-1 login-title">CRUZASO</h1>
            </div>

            <p class="h5 text-muted mt-5 d-flex flex-column gap-4 ">
                <a href="#">Dashboard</a>
                <a href="#">My Tasks</a>
                <a href="./profile.html">Profile</a>
            </p>

        </aside>

        <div class="ct-main">
            <header id="ctTopbar">
            </header>

            <div class="d-flex align-items-center justify-content-between mt-3 flex-wrap gap-2">
                <div>
                    <h1 class="h4 fw-bold mb-0">Dashboard</h1>
                    <div class="ct-muted">Métricas generales del sistema y tareas recientes.</div>
                </div>
                <button id="btnNewTask" class="btn btn-primary ct-btn-primary">
                    <i class="bi bi-plus-lg"></i> New Task
                </button>
            </div>

            <section class="ct-metrics">
                <div class="ct-metric">
                    <div class="label"><span>Total Tasks</span><i class="bi bi-layers"></i></div>
                    <div id="mTotal" class="value">0</div>
                </div>
                <div class="ct-metric">
                    <div class="label"><span>Completed</span><i class="bi bi-check-circle"></i></div>
                    <div id="mCompleted" class="value">0</div>
                </div>
                <div class="ct-metric">
                    <div class="label"><span>Pending</span><i class="bi bi-hourglass-split"></i></div>
                    <div id="mPending" class="value">0</div>
                </div>
                <div class="ct-metric">
                    <div class="label"><span>Overall Progress</span><i class="bi bi-graph-up"></i></div>
                    <div class="value d-flex align-items-baseline gap-2">
                        <span id="mProgress">0%</span>
                        <span class="badge text-bg-light">Users: <span id="mUsers">0</span></span>
                    </div>
                </div>
            </section>

            <section class="ct-card mt-3">
                <div class="ct-card-header">
                    <div class="fw-bold">Upcoming / Recent Tasks</div>
                    <a class="btn btn-outline-secondary btn-sm" href="./tasks.html">
                        Ver todas <i class="bi bi-arrow-right"></i>
                    </a>
                </div>

                <div class="ct-card-body p-0">
                    <div class="table-responsive">
                        <table class="table ct-table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Task</th>
                                    <th style="width:190px;">Assignee</th>
                                    <th style="width:190px;">Status</th>
                                    <th style="width:120px;">Priority</th>
                                    <th style="width:140px;">Due date</th>
                                    <th style="width:120px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./admin-dashboard.js"></script>
</body>

</html>
