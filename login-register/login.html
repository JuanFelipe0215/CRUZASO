<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <main class="min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">

        <div class="text-center d-flex align-items-center mb-4">
            <img src="../images/Background.png" width="60px" alt="">
            <h1 class="h3 fw-black mb-1 login-title">CRUZASO</h1>
        </div>

        <div class="card card-soft shadow-lg p-4 p-md-5 login-card">
            <div class="text-center">
                <h1 class="h2 fw-black mb-1 login-title">Welcome back</h1>
                <p class="text-muted mb-4">Enter your credentials to access the <br>
                    platform</p>
            </div>

            <form>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input id="email" name="email" type="email" class="form-control" placeholder="name@example.com"
                            required>
                        <div class="invalid-feedback">Escribe un email válido.</div>
                        <div class="valid-feedback">¡Listo!</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text"><i class="bi bi-unlock2"></i></span>
                        <input id="password" name="password" type="password" class="form-control"
                            placeholder="example123*#" required minlength="6">
                        <div class="invalid-feedback">La contraseña es obligatoria (mín 6).</div>
                        <div class="valid-feedback">¡Ok!</div>
                    </div>
                </div>

                <p class="text-end mt-4 mb-4">
                    <a class="fw-bold text-decoration-none text-blue" href="./register.html">Forgot password?</a>
                </p>

                <button id="btnSignIn" type="button" class="btn btn-brand btn-lg w-100 py-3">
                    Sign In
                </button>

                <p class="text-center text-muted mt-4 mb-0">
                    Don't have an account?
                    <a class="fw-bold text-decoration-none text-blue" href="./register.html">Register</a>
                </p>
            </form>
        </div>
    </main>

    <script src="../guards/guard.js"></script>
    <script>
        redirectIfAuthenticated();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./auth.js"></script>
</body>

</html>
