<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUDZASO | Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../styles/style.css">
</head>

<body class="bg-light">
  <div class="container-fluid">
    <div class="row min-vh-100">


      <aside class="col-12 col-lg-3 col-xl-2 bg-white border-end p-3">
        <div class="d-flex align-items-center justify-content-center justify-content-lg-start gap-2 mb-4">
          <img src="../images/Background.png" width="44" alt="Logo">
          <div class="fw-bold">CRUDZASO</div>
        </div>

        <nav class="nav nav-pills flex-column gap-2">
          <a class="nav-link text-dark" href="./index.html"><i class="bi bi-list-check me-2"></i> My Tasks</a>
          <a class="nav-link active" href="./profile.html"><i class="bi bi-person me-2"></i> Profile</a>
        </nav>
      </aside>


      <main class="col-12 col-lg-9 col-xl-10 p-3 p-md-4">
        <header id="ctTopbar" class="mb-3"></header>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <div>
            <h1 class="h4 fw-bold mb-1">My Profile</h1>
            <div class="text-secondary">Informations personnelles.</div>
          </div>
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>

        <div class="row g-3">
          <div class="col-12 col-lg-4">
            <div class="card shadow-sm">
              <div class="card-body text-center">
                <div id="avatar" class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center user">
                  U
                </div>
                <h2 id="pName" class="h5 fw-bold mt-3 mb-1">—</h2>
                <div class="mb-2">
                  <span class="badge text-bg-secondary" id="pRole">user</span>
                </div>

                <div class="text-secondary small">
                  <i class="bi bi-envelope me-1"></i><span id="pEmail">—</span>
                </div>

                <hr>

                <div class="text-secondary small">My tasks</div>
                <div id="pTasks" class="fw-bold fs-4">0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
              <div class="card-header bg-white fw-bold">Personal Information</div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="text-secondary small">Full Name</div>
                    <div id="iFullName" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="text-secondary small">Email</div>
                    <div id="iEmail" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="text-secondary small">Role</div>
                    <div id="iRole" class="fw-semibold">—</div>
                  </div>
                  <div class="col-md-6">
                    <div class="text-secondary small">User ID</div>
                    <div id="iId" class="fw-semibold">—</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../guards/guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./profile.js"></script>
</body>
</html>
