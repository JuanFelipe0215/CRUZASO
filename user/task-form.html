<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRUDZASO | My Task Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
  <div class="container-fluid">
    <div class="row min-vh-100">


      <aside class="col-12 col-lg-3 col-xl-2 bg-white border-end p-3">
        <div class="d-flex align-items-center justify-content-center justify-content-lg-start gap-2 mb-4">
          <img src="../images/Background.png" width="44" alt="Logo">
          <div class="fw-bold">CRUDZASO</div>
        </div>

        <nav class="nav nav-pills flex-column gap-2">
          <a class="nav-link active" href="./index.html"><i class="bi bi-list-check me-2"></i> My Tasks</a>
          <a class="nav-link text-dark" href="./profile.html"><i class="bi bi-person me-2"></i> Profile</a>
        </nav>
      </aside>

   
      <main class="col-12 col-lg-9 col-xl-10 p-3 p-md-4">
        <header id="ctTopbar" class="mb-3"></header>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <div>
            <a class="text-decoration-none" href="./index.html"><i class="bi bi-arrow-left"></i> Back</a>
            <h1 id="pageTitle" class="h4 fw-bold mb-1 mt-2">Create New Task</h1>
          </div>
          <button id="btnLogout" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <div id="alertBox"></div>

            <form id="taskForm" class="row g-3" novalidate>
              <div class="col-12">
                <label class="form-label fw-semibold">Task Title *</label>
                <input id="title" class="form-control" required placeholder="e.g., Complete Quarter 3 Report">
                <div class="invalid-feedback">El título es obligatorio.</div>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Category</label>
                <input id="category" class="form-control" placeholder="developpement">
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Priority</label>
                <select id="priority" class="form-select">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Status</label>
                <select id="status" class="form-select">
                  <option value="pending" selected>Pending</option>
                  <option value="in progress">In Progress</option>
                  <option value="completed">Completed</option>
                </select>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label fw-semibold">Due date</label>
                <input id="dueDate" type="date" class="form-control">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Description</label>
                <textarea id="description" class="form-control" rows="4" placeholder="Add details about this task..."></textarea>
              </div>

              <div class="col-12 d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" href="./index.html">Cancel</a>
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-save me-1"></i> Save Task
                </button>
              </div>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../guards/guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./task-form.js"></script>
</body>
</html>
